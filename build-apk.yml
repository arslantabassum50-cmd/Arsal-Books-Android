name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Arsal_Books_Management_Mobile_V3_1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Arsal-Books-Management-APK
          path: Arsal_Books_Management_Mobile_V3_1.apk
          if-no-files-found: error
