name: Build Arslan Khata V18 Rebuild

on:
  push:
    branches:
      - chatgpt/arslan-khata-v18-rebuild
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore known-good Android project
        run: |
          cat apk_payload/part_* | tr -d '\n' | base64 -d > /tmp/khata.tar.gz
          gzip -t /tmp/khata.tar.gz
          mkdir -p khata-apk
          tar -xzf /tmp/khata.tar.gz -C khata-apk

      - name: Patch app to V18
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, base64

          root = Path('khata-apk')

          # Android app config: use a unique package so it installs side-by-side.
          b = root / 'app/build.gradle'
          s = b.read_text()
          s = re.sub(r'applicationId\s+["\'][^"\']+["\']', 'applicationId "com.arslanprinters.khata.v18rebuild"', s)
          s = re.sub(r'targetSdk\s+\d+', 'targetSdk 34', s)
          s = re.sub(r'versionCode\s+\d+', 'versionCode 18', s)
          s = re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "18.4"', s)
          b.write_text(s)

          # Real Arslan Printers logo as launcher icon.
          icon64 = Path('khata_v18_icon.webp.b64').read_text().strip()
          d = root / 'app/src/main/res/drawable'
          d.mkdir(parents=True, exist_ok=True)
          (d / 'arslan_logo.webp').write_bytes(base64.b64decode(icon64))

          # Manifest: short name + real launcher logo.
          m = root / 'app/src/main/AndroidManifest.xml'
          ms = m.read_text()
          ms = re.sub(r'android:label="[^"]*"', 'android:label="Arslan Khata"', ms)
          if 'android:icon=' in ms:
              ms = re.sub(r'android:icon="[^"]*"', 'android:icon="@drawable/arslan_logo"', ms)
          else:
              ms = ms.replace('<application', '<application android:icon="@drawable/arslan_logo"', 1)
          if 'android:roundIcon=' in ms:
              ms = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@drawable/arslan_logo"', ms)
          else:
              ms = ms.replace('<application', '<application android:roundIcon="@drawable/arslan_logo"', 1)
          m.write_text(ms)

          # HTML: V18 labels + Android bottom safe area fix.
          h = root / 'app/src/main/assets/index.html'
          hs = h.read_text()
          hs = hs.replace('<title>Arslan Printers Khata V13 Business Pro</title>', '<title>Arslan Khata V18</title>')
          hs = hs.replace('Premium JPG • PDF • AI • V13', 'Premium JPG • PDF • AI • V18')
          hs = hs.replace('Recovery Khata V13', 'Khata V18')
          hs = hs.replace('Arslan_Printers_Khata_V13_Backup_', 'Arslan_Printers_Khata_V18_Backup_')
          css = '''
          <style id="v18-bottom-safe-fix">
          :root{--android-nav-safe:max(env(safe-area-inset-bottom,0px),34px)}
          html,body{min-height:100%;overscroll-behavior-y:none}
          body{padding-bottom:0!important}
          .app{min-height:100dvh!important;padding-bottom:calc(112px + var(--android-nav-safe))!important}
          .nav{bottom:0!important;height:calc(74px + var(--android-nav-safe))!important;padding-bottom:var(--android-nav-safe)!important;grid-auto-rows:74px!important;align-content:start!important}
          .nav button{height:74px!important;min-height:74px!important;padding:8px 2px 6px!important;align-self:start!important}
          .nav .center .ico{margin:-20px auto 2px!important}
          .fab{bottom:calc(96px + var(--android-nav-safe))!important}
          .aiFab{bottom:calc(98px + var(--android-nav-safe))!important}
          .toast{bottom:calc(94px + var(--android-nav-safe))!important}
          .bottomEntry{bottom:calc(76px + var(--android-nav-safe))!important;padding-bottom:8px!important}
          </style>
          '''
          if 'v18-bottom-safe-fix' not in hs:
              hs = hs.replace('</head>', css + '\n</head>', 1)
          h.write_text(hs)
          PY

          # Native Android wrapper for WhatsApp, JPG save/share and PDF printing.
          cat > khata-apk/app/src/main/java/com/arslanprinters/khata/MainActivity.java <<'JAVA'
          package com.arslanprinters.khata;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.util.Base64;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.parseColor("#F44322"));
                  getWindow().setNavigationBarColor(Color.WHITE);
                  if (android.os.Build.VERSION.SDK_INT >= 26) {
                      getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR);
                  }

                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setTextZoom(100);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(false);
                  if (android.os.Build.VERSION.SDK_INT >= 21) {
                      s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  }

                  webView.addJavascriptInterface(new AndroidBridge(this), "AndroidBridge");
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleExternal(request.getUrl());
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleExternal(Uri.parse(url));
                      }
                  });
                  webView.loadUrl("file:///android_asset/index.html");
              }

              private boolean handleExternal(Uri uri) {
                  if (uri == null) return false;
                  String scheme = uri.getScheme() == null ? "" : uri.getScheme().toLowerCase();
                  String host = uri.getHost() == null ? "" : uri.getHost().toLowerCase();
                  boolean external = scheme.equals("tel") || scheme.equals("sms") || scheme.equals("mailto") ||
                          scheme.equals("whatsapp") || host.equals("wa.me") || host.contains("whatsapp.com");
                  if (!external) return false;
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (Exception e) {
                      Toast.makeText(this, "Required app not found", Toast.LENGTH_SHORT).show();
                  }
                  return true;
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              public class AndroidBridge {
                  private final Context context;
                  AndroidBridge(Context c) { context = c; }

                  private byte[] decode(String dataUrl) {
                      if (dataUrl == null) return null;
                      int comma = dataUrl.indexOf(',');
                      String raw = comma >= 0 ? dataUrl.substring(comma + 1) : dataUrl;
                      return Base64.decode(raw, Base64.DEFAULT);
                  }

                  private String safe(String n) {
                      if (n == null || n.trim().isEmpty()) return "Arslan_Khata.jpg";
                      return n.replaceAll("[^A-Za-z0-9._-]", "_");
                  }

                  private Uri saveImage(byte[] bytes, String fileName, String relPath) throws Exception {
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Images.Media.DISPLAY_NAME, safe(fileName));
                      v.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                      if (android.os.Build.VERSION.SDK_INT >= 29) {
                          v.put(MediaStore.Images.Media.RELATIVE_PATH, relPath);
                          v.put(MediaStore.Images.Media.IS_PENDING, 1);
                      }
                      Uri u = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
                      if (u == null) throw new Exception("Unable to create image");
                      try (OutputStream out = getContentResolver().openOutputStream(u)) {
                          if (out != null) out.write(bytes);
                      }
                      if (android.os.Build.VERSION.SDK_INT >= 29) {
                          v.clear();
                          v.put(MediaStore.Images.Media.IS_PENDING, 0);
                          getContentResolver().update(u, v, null, null);
                      }
                      return u;
                  }

                  @JavascriptInterface
                  public void saveJpg(String data, String file) {
                      try {
                          saveImage(decode(data), file, "Pictures/Arslan Khata");
                          runOnUiThread(() -> Toast.makeText(context, "JPG saved", Toast.LENGTH_SHORT).show());
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(context, "JPG save failed", Toast.LENGTH_SHORT).show());
                      }
                  }

                  @JavascriptInterface
                  public void shareJpg(String data, String file, String text) {
                      try {
                          Uri u = saveImage(decode(data), file, "Pictures/Arslan Khata/Shared");
                          Intent send = new Intent(Intent.ACTION_SEND);
                          send.setType("image/jpeg");
                          send.putExtra(Intent.EXTRA_STREAM, u);
                          if (text != null && !text.trim().isEmpty()) send.putExtra(Intent.EXTRA_TEXT, text);
                          send.setClipData(ClipData.newRawUri("Reminder", u));
                          send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          startActivity(Intent.createChooser(send, "Share reminder"));
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(context, "Share failed", Toast.LENGTH_SHORT).show());
                      }
                  }

                  @JavascriptInterface
                  public void openWhatsAppText(String url) {
                      runOnUiThread(() -> handleExternal(Uri.parse(url)));
                  }

                  @JavascriptInterface
                  public void printPage() {
                      runOnUiThread(() -> {
                          try {
                              PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                              PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter("Arslan Khata PDF");
                              PrintAttributes attrs = new PrintAttributes.Builder()
                                      .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                      .setColorMode(PrintAttributes.COLOR_MODE_COLOR)
                                      .build();
                              pm.print("Arslan Khata PDF", adapter, attrs);
                          } catch (Exception e) {
                              Toast.makeText(context, "PDF/Print failed", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }
              }
          }
          JAVA

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build real signed debug APK
        working-directory: khata-apk
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signatures
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs khata-apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp khata-apk/app/build/outputs/apk/debug/app-debug.apk khata-apk/app/build/outputs/apk/debug/Arslan_Khata_V18_Rebuild.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Arslan-Khata-V18-Rebuild
          path: khata-apk/app/build/outputs/apk/debug/Arslan_Khata_V18_Rebuild.apk
          if-no-files-found: error
